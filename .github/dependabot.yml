version: 2
updates:
  # The actions are pinned by commit; Dependabot moves the pin and its comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  # The dev toolchain of package-lock.json; the package itself has no runtime dependency.
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    versioning-strategy: increase-if-necessary
